# 보안 검사 — 비밀값 유출(gitleaks, 전체 이력), 의존성·Dockerfile·비밀값(trivy fs).
# PR·main 과 매주 월요일(새로 알려진 취약점은 코드가 그대로여도 생긴다). 로컬: docker 로 같은 도구를 돌릴 수 있다
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * 1'   # 월 09:17 KST
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0              # 이력 전체 — 지운 커밋에 남은 비밀값까지
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # PR 커밋 범위를 읽는 데만(개인 계정 저장소라 라이선스 불필요)

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 의존성·Dockerfile·비밀값 검사(SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        # 포크에서 온 PR 은 쓰기 토큰이 없어 올리지 못한다 — 실패 판정만
        if: always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: 실패 판정
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
