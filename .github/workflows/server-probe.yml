# 서버 점검(재사용 워크플로) — 서버에 아무것도 설치하지 않는다. SSH 로 읽기 전용 명령(부하·메모리·디스크·컨테이너·로그 끝)을
# 실행하고 결과는 실행 로그에 찍지 않고 콘솔(/dashapi/probe/ingest)로만 보낸다. restart 는 콘솔이 이름 확인 뒤 부른다.
#
# 부르는 쪽(서버를 맡은 저장소의 .github/workflows/probe.yml) — deploy/probe-caller.yml 을 복사해 쓴다:
#   uses: RosieOh/RosieOhConsole/.github/workflows/server-probe.yml@main
#   with: { server: <콘솔의 서버 id>, ssh-host: 'user@host', ssh-port: '22', key: PROD, action/target/lines/confirm }
#   secrets: inherit
# 필요한 시크릿·변수(부르는 저장소 또는 계정): <KEY>_SSH_KEY, <KEY>_SSH_KNOWN_HOSTS, PROBE_TOKEN(콘솔과 같은 값), 변수 CONSOLE_URL
name: server-probe

on:
  workflow_call:
    inputs:
      server:   { type: string, required: true, description: '콘솔의 서버 id(api/src/infra/defaults.ts)' }
      ssh-host: { type: string, required: true, description: 'user@host' }
      ssh-port: { type: string, default: '22' }
      key:      { type: string, default: 'PROD', description: '시크릿 이름 앞부분 — <KEY>_SSH_KEY, <KEY>_SSH_KNOWN_HOSTS' }
      action:   { type: string, default: 'probe', description: 'probe · logs · restart' }
      target:   { type: string, default: '', description: '서비스 이름(logs·restart) — 컨테이너 <target> 또는 <target>-web-*' }
      lines:    { type: string, default: '300' }
      confirm:  { type: string, default: '', description: 'restart 일 때 target 을 그대로' }

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 입력 검사
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$ACTION" in probe|logs|restart) ;; *) echo "action 은 probe·logs·restart" >&2; exit 1 ;; esac
          if [ "$ACTION" != probe ] && ! printf '%s' "$TARGET" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'; then echo "target 이름이 올바르지 않습니다" >&2; exit 1; fi
          if [ "$ACTION" = restart ] && [ "$CONFIRM" != "$TARGET" ]; then echo "restart 는 confirm 에 target 을 그대로" >&2; exit 1; fi

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', inputs.key)] }}
          KNOWN: ${{ secrets[format('{0}_SSH_KNOWN_HOSTS', inputs.key)] }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "${{ inputs.key }}_SSH_KEY 시크릿이 없습니다" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_probe && chmod 600 ~/.ssh/id_probe
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else echo "::warning::${{ inputs.key }}_SSH_KNOWN_HOSTS 가 없어 처음 본 호스트 키를 받아들입니다"; fi

      - name: 점검(결과는 파일로만 — 로그에 찍지 않는다)
        id: run
        env:
          HOST: ${{ inputs.ssh-host }}
          PORT: ${{ inputs.ssh-port }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          LINES: ${{ inputs.lines }}
        run: |
          set +e
          # ── 서버에서 도는 수집기(읽기 전용, restart 만 예외) — 시험(api/test/probe-collector.test.mjs)이 이 구역을 그대로 꺼내 돌린다
          cat > /tmp/collect.sh <<'COLLECT'
          # mx:collect:start
          set -u
          ACTION="${1:-probe}"; TARGET="${2:-}"; LINES="${3:-300}"
          echo "=== mx:meta ==="
          echo "host=$(hostname)"
          echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "uptime_s=$(cut -d. -f1 /proc/uptime)"
          echo "cpus=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          echo "load=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo "=== mx:mem ==="
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          echo "=== mx:disk ==="
          df -B1 -P -x tmpfs -x devtmpfs -x overlay -x squashfs 2>/dev/null | tail -n +2 | awk '{print $1, $2, $3, $4, $5, $6}'
          if command -v docker >/dev/null 2>&1; then
            D=docker; docker ps >/dev/null 2>&1 || D="sudo -n docker"
            echo "=== mx:ps ==="
            $D ps -a --format '{{.Names}}\t{{.Image}}\t{{.State}}\t{{.Status}}\t{{.CreatedAt}}' 2>/dev/null
            echo "=== mx:stats ==="
            $D stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}' 2>/dev/null
            if [ "$ACTION" != probe ] && [ -n "$TARGET" ]; then
              C=$($D ps --format '{{.Names}}' 2>/dev/null | grep -E "^${TARGET}(-web-.*)?$" | head -1)
              if [ "$ACTION" = logs ] && [ -n "$C" ]; then echo "=== mx:logs:$C ==="; $D logs --tail "$LINES" "$C" 2>&1 | tail -n "$LINES"; fi
              if [ "$ACTION" = restart ]; then echo "=== mx:restart:$C ==="; if [ -n "$C" ]; then $D restart "$C" >/dev/null 2>&1 && echo "다시 시작함" || echo "다시 시작 실패"; else echo "컨테이너 없음"; fi; fi
            fi
          fi
          # mx:collect:end
          COLLECT
          ssh -i ~/.ssh/id_probe -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "$HOST" "bash -s -- '$ACTION' '$TARGET' '$LINES'" < /tmp/collect.sh > /tmp/probe.txt 2>/tmp/probe.err
          code=$?
          echo "ok=$([ $code -eq 0 ] && grep -q '^=== mx:meta ===' /tmp/probe.txt && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] || echo "::warning::SSH 접속·명령 실패(코드 $code)"
          exit 0

      - name: 콘솔로 보내기
        env:
          CONSOLE_URL: ${{ vars.CONSOLE_URL }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
          SERVER: ${{ inputs.server }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          OK: ${{ steps.run.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$CONSOLE_URL" ] && [ -n "$PROBE_TOKEN" ] || { echo "CONSOLE_URL 변수와 PROBE_TOKEN 시크릿이 필요합니다" >&2; exit 1; }
          q="server=$(jq -rn --arg v "$SERVER" '$v|@uri')&action=$ACTION&target=$(jq -rn --arg v "$TARGET" '$v|@uri')&ok=$OK&run=$(jq -rn --arg v "$RUN_URL" '$v|@uri')"
          code=$(curl -sS -o /tmp/ingest.out -w '%{http_code}' -X POST "${CONSOLE_URL%/}/dashapi/probe/ingest?$q" \
            -H "Authorization: Bearer $PROBE_TOKEN" -H 'Content-Type: text/plain' --data-binary @/tmp/probe.txt)
          [ "$code" = 200 ] || { echo "콘솔이 HTTP $code 로 답했습니다" >&2; exit 1; }
          echo "콘솔에 보냈습니다($ACTION, 접속 ${OK})"
          rm -f /tmp/probe.txt ~/.ssh/id_probe
