# main 에 머지되면 콘솔 이미지를 만들어 GHCR 에 올린다 — ghcr.io/<owner>/<repo>:<커밋 12자>, :latest
# amd64·arm64 를 한 이름(멀티 아키텍처)으로 — 서버가 자기에게 맞는 것을 받는다. 빌드·시험은 amd64 에서 한 번(Dockerfile 참고)
# 서버에서는 deploy/compose.prod.yml 이 이 이미지를 받아 띄운다(어디에 띄울지는 정하는 대로)
name: image

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1'   # 월 10:23 KST — 코드가 그대로여도 새 보안 패치를 받아 다시 올린다
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write   # 이미지 검사 결과를 Security 탭(code scanning)에 올린다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 이미지 이름(소문자)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VITE_GITHUB_OWNER=${{ github.repository_owner }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime   # 실행 단계는 늘 새로(apk upgrade 로 보안 패치를 받게)

      # 올린 이미지 검사 — 결과는 Security 탭에 쌓고, 고칠 수 있는 HIGH·CRITICAL 이 있으면 실패로 알린다
      - name: 이미지 취약점 검사(SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: 이미지 취약점 검사(실패 판정)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
